<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="home-container">

        <a href="SelectPage/SeletPage.html" class="home-btn"></a>

        <div class="home-leftSide home-side">
            <div class="home-ajdBox">
                <img id="img1" src="img/ajd.png">
                <button onclick="X1()" class="mr-X">X</button>
            </div>  

            <div class="home-churchBox">
                <img id="img2" src="img/church.png">
                <button onclick="X2()" class="mr-X">X</button>
            </div>
        </div>
        <div class="home-main">
            <iframe
                width="100%"
                height="100%"
                id="home-mainIframe">
            </iframe>
        </div>
        <div class="home-rightSide home-side">
            <iframe 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen
                id="home-youtube">
            </iframe>
            <iframe 
                src="https://js-dos.com/games/doom.exe.html" 
                width="1780" height="900" 
                frameborder="0" scrolling="yes" 
                allowfullscreen
                id="home-doom">
            </iframe>
            
            <div class="home-copang">
                <img id="img3" src="img/copang.png">
                <button onclick="X3()" class="mr-X">X</button>
            </div>
        </div>
    </div>

    <script>
        const Selected = localStorage.getItem('Selected');
        const contentLink = localStorage.getItem('contentLink');
        const isAbsolute = localStorage.getItem('isAbsolute');
        const ytLink = localStorage.getItem('ytLink');
        
        const youtubeFrame = document.querySelector('#home-youtube');
        const doomFrame = document.querySelector('#home-doom');
        const rightSide = document.querySelector('.home-rightSide');
        const mainIframe = document.querySelector('#home-mainIframe');
        const homeSides = document.querySelectorAll('.home-side');

        const XBU = document.querySelector('.mr-X');

        let sideFrameCovered = false;

        if(Selected === "doom") {
            rightSide.classList.add('doom-selected');
            doomFrame.style.display = "inline-block";
            youtubeFrame.style.display = "none";
        }
        else {
            youtubeFrame.style.display = "inline-block";
            doomFrame.style.display = "none";
        }

        if (contentLink) {
            mainIframe.src = contentLink;
        } else {
            mainIframe.srcdoc = `<!doctype html>
                <html lang="ko">
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <body style="font: 16px Arial, sans-serif; display: grid; place-content: center; min-height: 95vh; color: #333;">
                    <p>화면의 오른쪽 위를 클릭해 이것저것 설정 할 수 있습니다.</p>
                </body>
                </html>`;
        }

        if (ytLink) {
            youtubeFrame.src = ytLink;
        } else {
            youtubeFrame.style.display = "none";
        }

        if (isAbsolute === 'true') {
            homeSides.forEach(side => side.classList.add('absolute'));
            document.querySelector('.home-main').classList.add('absolute-main');
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                sideFrameCovered = !sideFrameCovered;
                const activeFrame = Selected === 'doom' ? doomFrame : youtubeFrame;
                activeFrame.classList.toggle('iframe-covered', sideFrameCovered);
            }
        });

        function X1(){
            const img1 = document.getElementById("img1");
            if(img1.getAttribute("src") !== "img/광고.png"){
                img1.src = "img/광고.png";
                XBU.style.display = "none";
            }else{
                img1.src = "img/ajd.png";
                XBU.style.display = "flex";
            }
        }
        function X2(){
            const img2 = document.getElementById("img2");
            if(img2.getAttribute("src") !== "img/광고.png"){
                img2.src = "img/광고.png";
                XBU.style.display = "none";
            }else{
                img2.src = "img/church.png";
                XBU.style.display = "flex";
            }
        }
        function X3(){
            const img3 = document.getElementById("img3");
            if(img3.getAttribute("src") !== "img/광고.png"){
                img3.src = "img/광고.png";
                XBU.style.display = "none";
            }else{
                img3.src = "img/copang.png";
                XBU.style.display = "flex";
            }
        }
    </script>
</body>
</html>
