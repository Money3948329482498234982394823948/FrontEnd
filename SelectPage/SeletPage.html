<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="/SelectPage/Select.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택 페이지</title>
</head>
<body>
    <a class="back" href="../index.html">
        <- 돌아가기
    </a>
    
    <div class="aBox">
        <a href="/SelectPage/SeletPage.html">1</a>
        <a href="/fakeWebPage/fakewebpage.html">2</a>
        <a href="/youtube/yedit.html">3</a>
    </div>
    <h1>유튜브와 둠 중 원하는 것을 고르시오</h1>
    <form>
        <button type="button" id="youtubeBtn"><img src="/SelectPage/YouTube.png" alt="유튜브" height="500px" width="350px"></button>
        <button type="button" id="doomBtn"><img src="/SelectPage/Doom.png" alt="둠" height="500px" width="350px"></button>
    </form>
    <script>
        const youtubeBtn = document.querySelector('#youtubeBtn');
        const doomBtn = document.querySelector('#doomBtn');

        if (localStorage.getItem('Selected') === "doom"){
            youtubeBtn.style.border = "1px solid black";
            doomBtn.style.border = "2px solid red";
        }
        else {
            youtubeBtn.style.border = "2px solid red";
            doomBtn.style.border = "1px solid black";
        }

        youtubeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            SeletY();
        });
        doomBtn.addEventListener('click', (e) => {
            e.preventDefault();
            SeletD();
        });

        function SeletD(){
            localStorage.setItem('Selected', "doom");
            youtubeBtn.style.border = "1px solid black";
            doomBtn.style.border = "2px solid red";
        }
        function SeletY(){
            localStorage.setItem('Selected', "youtube");
            youtubeBtn.style.border = "2px solid red";
            doomBtn.style.border = "1px solid black";
        }
    </script>
</body>
</html>
