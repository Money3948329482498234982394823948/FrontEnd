<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 링크 설정</title>
    <link rel="stylesheet" href="youtube.css">
</head>
<body>
    <!-- 우측 상단 딴짓 화면: 영상만 재생, 링크는 X를 눌러 yedit.html에서 입력 -->
    <div class="yt-box">
        <div class="yt-player" id="yt-player">
            <p class="yt-empty">X를 눌러 유튜브 링크를 입력하세요</p>
        </div>
        <a class="yt-x" href="yedit.html">X</a>
    </div>

    <script src="youtube.js"></script>
</body>
</html>
