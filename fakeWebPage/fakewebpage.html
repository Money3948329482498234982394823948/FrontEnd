<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가짜 웹사이트 설정</title>
  <link rel="stylesheet" href="fakewebpage.css">
  <script src="fakewebpage.js" defer></script>
</head>
<body>
  <nav class="aBox" aria-label="설정 페이지 이동">
    <a href="/SelectPage/SeletPage.html">1</a>
    <a href="/fakeWebPage/fakewebpage.html">2</a>
    <a href="/youtube/yedit.html">3</a>
  </nav>
  <main class="content-edit">
    <h1 class="content-edit__title">가짜 웹사이트를 입력하시오</h1>

    <form id="content-edit-form" novalidate>
      <input
        id="Content-input"
        class="content-edit__input"
        type="text"
        placeholder="웹사이트 주소를 입력하세요"
        aria-label="가짜 웹사이트 주소"
        autocomplete="url"
      >

      <section class="recent-addresses" aria-labelledby="recent-addresses-title">
        <h2 id="recent-addresses-title">최근 주소</h2>
        <ul id="recent-addresses-list" class="recent-addresses__list"></ul>
        <p id="recent-addresses-empty" class="recent-addresses__empty">최근 주소가 없습니다.</p>
      </section>
      <div class="content-edit__actions">
        <button type="button" id="Content-cancel">취소하기</button>
        <button type="submit" id="Content-submit">입력하기</button>
      </div>

      <div class="content-edit__overlay">
        <label for="absoluteCheck">광고 이미지를 웹사이트 위에 덮씌우기</label>
        <input type="checkbox" id="absoluteCheck">
      </div>
    </form>

    <p id="content-edit-message" class="content-edit__message" role="status" aria-live="polite"></p>
    <a class="back" href="../index.html">← 돌아가기</a>
  </main>
</body>
</html>
